name: Generate zine cover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install image CLI dependencies
        run: python -m pip install --disable-pip-version-check openai pillow

      - name: Generate one test cover
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p output/imagegen
          python .github/tools/image_gen.py generate \
            --prompt-file .github/imagegen/forty-fifth-sunset.txt \
            --model gpt-image-2 \
            --quality low \
            --size 1024x1536 \
            --out output/imagegen/forty-fifth-sunset-test.png

      - name: Upload generated cover
        uses: actions/upload-artifact@v4
        with:
          name: forty-fifth-sunset-test-cover
          path: output/imagegen/forty-fifth-sunset-test.png
          if-no-files-found: error
          retention-days: 7
